name: 股癌最新一集摘要（語音辨識）

# 節目的 RSS 簡介只有一行預告加一整段業配，內容不在裡面。要知道「這集在講
# 什麼」只能聽——下載音訊、跑語音辨識，再讓本機的 Ollama 整理成幾行重點。
#
# 只發表摘要：逐字稿跑完就刪，不進版控。轉錄是為了理解，不是重製節目內容。
#
# 跑在 self-hosted runner 上（你自己的機器），因為：
#   1. Ollama 在你機器上，GitHub 的 runner 連不到。
#   2. 有 GPU，Whisper 可以用 medium/large 而不是勉強的 small。
# 前提：那台機器上 Ollama 要是啟動狀態、而且已經 pull 好模型。沒有的話這支
# 會印 warning 然後安全跳過，網站沿用節目簡介版。

on:
  schedule:
    # 股癌只有週三、週六出新集數（EP693 是 Wed 07:30 GMT ＝ 台灣 15:30）。
    # 每天跑沒有意義，改成只在這兩天。一天跑兩次是為了容錯：如果那天發得晚，
    # 第一次會撲空，第二次補上；已經做過的集數只花幾秒查 feed 就跳過。
    - cron: "0 10,16 * * 3,6"    # 台灣 18:00 與 隔日 00:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gooaye-summary
  cancel-in-progress: false

env:
  GOOAYE_LLM: ${{ vars.GOOAYE_LLM || 'ollama' }}
  GOOAYE_OLLAMA_MODEL: ${{ vars.GOOAYE_OLLAMA_MODEL || 'qwen2.5:7b' }}
  # 有 GPU 就別用 small：medium 對中文口語準不少，large-v3 更好但吃 VRAM
  GOOAYE_WHISPER: ${{ vars.GOOAYE_WHISPER || 'medium' }}
  GOOAYE_WHISPER_DEVICE: ${{ vars.GOOAYE_WHISPER_DEVICE || 'auto' }}
  OLLAMA_HOST: ${{ vars.OLLAMA_HOST || 'http://127.0.0.1:11434' }}

jobs:
  summarize:
    # 你的機器。標籤不是 self-hosted 的話設 repo variable GOOAYE_RUNNER 覆蓋。
    runs-on: ${{ vars.GOOAYE_RUNNER || 'self-hosted' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 這一集需要處理嗎
        id: need
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          # 先問 feed：同一集已經有逐字稿摘要就整支跳過，不用建 venv、不用載模型
          import json, sys
          sys.path.insert(0, "scripts")
          try:
              import fetch_gooaye as feed
              item, _ = feed.latest_item()
              guid = feed.guid_of(item)
          except Exception:
              print("run=true")           # 查不到就照跑，讓主流程去處理錯誤
              raise SystemExit(0)
          try:
              old = json.load(open("gooaye.json", encoding="utf-8"))
          except Exception:
              old = {}
          done = old.get("source_kind") == "whisper" and old.get("guid") == guid
          print("run=%s" % ("false" if done else "true"))
          PY

      # self-hosted runner 是常駐的，別把套件裝進系統 python
      - name: 建 venv 並安裝相依
        if: steps.need.outputs.run == 'true'
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install --quiet faster-whisper
          if [ "$GOOAYE_LLM" = anthropic ]; then .venv/bin/pip install --quiet anthropic; fi

      - name: 轉錄並摘要
        if: steps.need.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: .venv/bin/python scripts/summarize_gooaye.py

      - name: 套用到網站並提交
        if: steps.need.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/patch_site.py
          if [ -z "$(git status --porcelain)" ]; then
            echo "無變更，完成。"; exit 0
          fi
          git add -A
          git commit -m "股癌最新一集摘要 [skip ci]"
          for i in 1 2 3; do
            git push origin main && exit 0
            echo "push 被拒（引擎推了新檔），拉最新重試…"
            git fetch origin main && git rebase origin/main || exit 1
            sleep 10
          done
          echo "::error::重試 3 輪仍無法推送"; exit 1

      - name: 清掉 venv
        if: always()
        run: rm -rf .venv
