name: 盤前預估分數（美股隔夜 + 夜盤）

# 每天台股開盤前，用美股隔夜（台積電 ADR / 費半 / 標普）算一個「盤前預估分數」，
# 注入 index.html 的主分數區塊下方（標示「盤前預估・非正式」）。
# 收盤後外部引擎重生頁面會自然蓋掉它，隔天早上本排程再算一次。詳見 PREMARKET_SCORE.md。
#
# 不會無限迴圈：用內建 GITHUB_TOKEN 推送（GitHub 規定不會再觸發 workflow），
# commit 訊息再帶 [skip ci] 保險。抓不到行情時腳本不改檔，也就不會 commit。

on:
  schedule:
    # 主要由 site-patch 在引擎推完首頁後順便注入；這裡是備援。GitHub 排程常延遲數小時，
    # 腳本帶 --window，過了 09:00 開盤就不算，避免盤中冒出「盤前預估」。
    - cron: "30 0 * * 1-5"   # 台灣 08:30（UTC 00:30），週一至週五；引擎 08:00 跑完後
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: premarket-score
  cancel-in-progress: false

jobs:
  premarket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 引擎同一時段會連推好幾個檔，push 被拒就以最新基底重算（最多三輪）
      - name: 算盤前分數並注入＋提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FLAG="--window"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then FLAG=""; fi
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/premarket_score.py $FLAG
            if [ -z "$(git status --porcelain)" ]; then
              echo "無變更（不在開盤前、行情抓取失敗或已是最新），略過。"; exit 0
            fi
            git add index.html
            git commit -m "盤前預估分數更新 [skip ci]"
            if git push origin main; then
              echo "已注入盤前分數並推送。"; exit 0
            fi
            echo "第 $i 輪：push 被拒，20 秒後以最新基底重算…"
            sleep 20
          done
          echo "::error::重試 3 輪仍無法推送"; exit 1
