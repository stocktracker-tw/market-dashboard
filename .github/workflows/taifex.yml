name: 台指期籌碼（TAIFEX）

# 抓台灣期交所每日台指期籌碼（三大法人/外資淨未平倉、選擇權 P/C 比），
# 寫進 taifex.json，再跑 patch_site 把「台指期籌碼」卡注入 index.html。
# 自包含：在同一個 job 內完成抓取＋注入＋提交（GITHUB_TOKEN 推送不會再觸發
# 其他 workflow，所以不依賴 site-patch 串接）。

on:
  schedule:
    - cron: "0 8 * * 1-5"      # 約 16:00 台北（盤後結算資料出齊後），週一至五
    # 實測晚上那輪（排程延遲到 ~21:00）抓到的都還是前一個交易日，卡片永遠慢一天；
    # 隔天開盤前再抓一次，讓盤前分數與首頁卡片用到最新一天。資料沒變就不會提交。
    - cron: "30 23 * * 0-4"    # 07:30 台北，週一至五
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: taifex
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓 TAIFEX 台指期籌碼
        run: python scripts/fetch_taifex.py

      # 早上那輪會撞上引擎連推，push 被拒就以最新基底重補（最多五輪）
      - name: 注入台指期籌碼卡＋提交
        run: |
          if git diff --quiet -- taifex.json; then
            echo "taifex.json 無變更（可能今日資料未出或抓取失敗），略過。"; exit 0
          fi
          cp taifex.json "$RUNNER_TEMP/taifex.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/taifex.json" taifex.json
            python scripts/patch_site.py
            if [ -z "$(git status --porcelain)" ]; then
              echo "第 $i 輪：無需變更，完成。"; exit 0
            fi
            git add -A
            git commit -m "更新台指期籌碼（TAIFEX）[skip ci]"
            if git push origin main; then
              echo "第 $i 輪：已推送，完成。"; exit 0
            fi
            echo "第 $i 輪：push 被拒，20 秒後以最新基底重補…"
            sleep 20
          done
          echo "::error::重試 5 輪仍無法推送"; exit 1
